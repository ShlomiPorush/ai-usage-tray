name = "ai-usage-tray-view"
# Generated by `node bundle.mjs`: the API plus the embedded viewer page.
# Switch to "worker.js" for the API-only variant (page hosted elsewhere).
main = "worker.bundle.js"
compatibility_date = "2026-08-01"

# Configure VAPID_PUBLIC_KEY and VAPID_SUBJECT as variables, and store
# VAPID_PRIVATE_KEY with `wrangler secret put VAPID_PRIVATE_KEY`.
# Optional: PUSH_ENDPOINT_ALLOWED_HOSTS, a comma-separated host list that
# replaces the built-in browser push-service list.

[[kv_namespaces]]
binding = "USAGE"
# Replace this placeholder with the id printed by:
#   wrangler kv namespace create USAGE
id = "0000000000000000000000000000000f"
