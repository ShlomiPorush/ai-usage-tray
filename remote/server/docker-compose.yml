# Runs the published image behind Traefik with its Docker provider, on the external "traefik"
# network, so no port is published. Copy this file and .env.example next to each other, then copy
# .env.example to .env and fill it. Another reverse proxy needs this file adapted.
name: ai-usage-tray

services:
  remote-view:
    image: ghcr.io/shlomiporush/ai-usage-tray:${VERSION}
    restart: unless-stopped
    volumes:
      - ./data:/data
    read_only: true
    # The drain marker of a zero-downtime update lives here.
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only the entrypoint uses these: prepare /data and switch to UID 10001.
    # The server process itself ends up with an empty effective capability set.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Longest request: 15 s to receive it, up to 5 s waiting for SQLite and
    # 10 s for browser push delivery. Shutdown waits for open requests.
    stop_grace_period: 30s
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.ai-usage-tray.loadbalancer.server.port=8080"
      - "traefik.http.routers.ai-usage-tray.entrypoints=https"
      - "traefik.http.routers.ai-usage-tray.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ai-usage-tray.tls=true"
      - "traefik.http.routers.ai-usage-tray.service=ai-usage-tray"
      - "traefik.http.routers.ai-usage-tray.middlewares=default@file"
    environment:
      - SNAPSHOT_TTL_SECONDS=604800
      - CLEANUP_INTERVAL_SECONDS=3600
      # Refuse to start instead of silently running the server as container root.
      - RELAY_REQUIRE_NONROOT=1
      # Optional absolute path for the push signing key. Default: /data/vapid.json.
      - VAPID_KEY_PATH
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - VAPID_SUBJECT
      # Optional, comma separated. Replaces the built-in push-service host list.
      - PUSH_ENDPOINT_ALLOWED_HOSTS
      # Write throttling. The defaults suit a public relay; see README.md.
      # A private key here is only worth setting when the desktop apps that use
      # this relay are configured with the same value. The repository default is
      # public, so it separates nothing on a public relay.
      - SNAPSHOT_SIGNING_KEY
      - UNSIGNED_PUT_PER_MINUTE
      - SIGNED_PUT_PER_MINUTE
      # This service always runs behind a reverse proxy, so without this every
      # request would be counted against the proxy's own address. The relay
      # reads the last X-Forwarded-For entry, the one the proxy adds (see
      # README.md); set 0 when nothing is in front of the container.
      - TRUST_PROXY=1
      # Optional: purge the Cloudflare cache once at startup so a deploy is
      # visible immediately. "files" purges only the viewer shell addresses
      # under PUBLIC_BASE_URL; "everything" drops the zone's whole cache.
      # The token needs the zone's Cache Purge permission; see README.md.
      - CLOUDFLARE_PURGE_ON_START
      - CLOUDFLARE_ZONE_ID
      - CLOUDFLARE_API_TOKEN
      - PUBLIC_BASE_URL

networks:
  traefik:
    external: true
