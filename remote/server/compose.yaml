services:
  remote-view:
    image: ghcr.io/shlomiporush/ai-usage-tray:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/app/server/healthcheck.sh"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      - SNAPSHOT_TTL_SECONDS=604800
      - CLEANUP_INTERVAL_SECONDS=3600
