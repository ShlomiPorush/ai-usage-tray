services:
  remote-view:
    image: ghcr.io/shlomiporush/ai-usage-tray:latest
    pull_policy: always
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - remote-view-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      - SNAPSHOT_TTL_SECONDS=604800
      - CLEANUP_INTERVAL_SECONDS=3600

volumes:
  remote-view-data:
    name: ai-usage-tray-remote-view-data
