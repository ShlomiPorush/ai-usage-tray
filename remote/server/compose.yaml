services:
  remote-view:
    image: ghcr.io/shlomiporush/ai-usage-tray:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only the entrypoint uses these: prepare /data and switch to UID 10001.
    # The server process itself ends up with an empty effective capability set.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/app/server/healthcheck.sh"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      - SNAPSHOT_TTL_SECONDS=604800
      - CLEANUP_INTERVAL_SECONDS=3600
      # Refuse to start instead of silently running the server as container root.
      - RELAY_REQUIRE_NONROOT=1
      # Optional absolute path for the push signing key. Default: /data/vapid.json.
      - VAPID_KEY_PATH
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - VAPID_SUBJECT
      # Optional, comma separated. Replaces the built-in push-service host list.
      - PUSH_ENDPOINT_ALLOWED_HOSTS
      # Write throttling. The defaults suit a public relay; see README.md.
      # A private key here is only worth setting when the desktop apps that use
      # this relay are configured with the same value. The repository default is
      # public, so it separates nothing on a public relay.
      - SNAPSHOT_SIGNING_KEY
      - UNSIGNED_PUT_PER_MINUTE
      - SIGNED_PUT_PER_MINUTE
      # This service is published on loopback only and always runs behind a
      # reverse proxy, so without this every request would be counted against
      # the proxy's own address. Configure the proxy to REPLACE X-Forwarded-For
      # (see README.md); set 0 when nothing is in front of the container.
      - TRUST_PROXY=1
      # Optional: purge the Cloudflare cache once at startup so a deploy is
      # visible immediately. "files" purges only the viewer shell addresses
      # under PUBLIC_BASE_URL; "everything" drops the zone's whole cache.
      # The token needs the zone's Cache Purge permission; see README.md.
      - CLOUDFLARE_PURGE_ON_START
      - CLOUDFLARE_ZONE_ID
      - CLOUDFLARE_API_TOKEN
      - PUBLIC_BASE_URL
