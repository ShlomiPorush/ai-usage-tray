<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" data-scheme="light" media="(prefers-color-scheme: light)" content="#EDE8E0">
<meta name="theme-color" data-scheme="dark" media="(prefers-color-scheme: dark)" content="#1A2233">
<title>AI Usage Tray</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<script>
  // Applied before first paint so a forced theme never flashes the other palette.
  try {
    var saved = localStorage.getItem("aiUsageTray.theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) { /* private mode: stay on the system theme */ }
</script>
</head>
<body>
<main class="page">
  <header class="page-header">
    <div class="header-row">
      <div class="title-group">
        <h1>AI usage</h1>
        <span class="version-badge" id="remote-version" hidden></span>
      </div>
      <span class="demo-badge" id="demo-badge" hidden>Demo data</span>
      <div class="header-actions">
        <div class="percent-toggle" id="percent-toggle" role="group"
             aria-label="Percentage display" hidden>
          <button type="button" class="percent-option" data-percent-mode="used"
                  aria-pressed="true">% used</button>
          <button type="button" class="percent-option" data-percent-mode="left"
                  aria-pressed="false">% left</button>
        </div>
        <button type="button" class="notification-toggle" id="notification-toggle" hidden>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>
          <span id="notification-label">Enable alerts</span>
        </button>
        <button type="button" class="notification-test" id="notification-test" hidden>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="M9 3h6"/>
            <path d="M10 3v5.4L5.4 17a2.7 2.7 0 0 0 2.4 4h8.4a2.7 2.7 0 0 0 2.4-4L14 8.4V3"/>
            <path d="M7.5 15h9"/>
          </svg>
          <span>Test notification</span>
        </button>
        <button type="button" class="theme-toggle" id="theme-toggle" data-mode="auto" hidden>
          <svg class="theme-icon theme-icon-auto" viewBox="0 0 24 24" width="18" height="18"
               fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.2"/>
            <path d="M12 3.8a8.2 8.2 0 0 1 0 16.4z" fill="currentColor" stroke="none"/>
          </svg>
          <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" width="18" height="18"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.22 4.22l1.56 1.56M18.22 18.22l1.56 1.56M2.5 12h2.2M19.3 12h2.2M4.22 19.78l1.56-1.56M18.22 5.78l1.56-1.56"/>
          </svg>
          <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" width="18" height="18"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="M20 13.6A8.2 8.2 0 0 1 10.4 4a8.2 8.2 0 1 0 9.6 9.6z"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="updated" id="updated" hidden></p>
  </header>

  <p class="notice notice-stale" id="staleness" role="status" hidden></p>
  <p class="notice notice-quiet" id="connection" role="status" hidden></p>
  <p class="notice notice-quiet" id="notifications" role="status" hidden></p>

  <div id="content"></div>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
