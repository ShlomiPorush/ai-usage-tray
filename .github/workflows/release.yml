name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  PROJECT_PATH: src/costats.App/costats.App.csproj

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [win-x64, win-arm64]
        include:
          - platform: win-x64
            artifact_name: ai-usage-tray-win-x64
          - platform: win-arm64
            artifact_name: ai-usage-tray-win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be major.minor.patch (e.g. 1.2.3). Received: $version"
          }

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime ${{ matrix.platform }} `
            --self-contained true `
            --output ./publish/${{ matrix.platform }} `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:VersionPrefix=${{ steps.version.outputs.VERSION }} `
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Create archive
        shell: pwsh
        run: |
          $zipName = "${{ matrix.artifact_name }}-v${{ steps.version.outputs.VERSION }}.zip"
          Compress-Archive -Path ./publish/${{ matrix.platform }}/* -DestinationPath ./$zipName
          $hash = (Get-FileHash -Path ./$zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumName = "$zipName.sha256"
          Set-Content -Path ./$checksumName -Value "$hash  $zipName" -Encoding Ascii
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
          echo "CHECKSUM_NAME=$checksumName" >> $env:GITHUB_OUTPUT
        id: archive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ./${{ steps.archive.outputs.ZIP_NAME }}
            ./${{ steps.archive.outputs.CHECKSUM_NAME }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be major.minor.patch (e.g. 1.2.3). Received: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -type f \( -name "*.zip" -o -name "*.sha256" \)

      - name: Generate changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT_TAG="v$VERSION"
          # Previous release tag (excluding the current one), if any
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
              echo ""
              echo ""
              echo "**Full changelog:** https://github.com/${REPO}/compare/${PREV_TAG}...${CURRENT_TAG}"
            else
              git log --pretty=format:"- %s (%h)" HEAD
              echo ""
              echo ""
              echo "_Initial release._"
            fi
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | Download | Checksum |"
            echo "|----------|----------|----------|"
            echo "| Windows x64 | \`ai-usage-tray-win-x64-v${VERSION}.zip\` | \`.sha256\` |"
            echo "| Windows ARM64 | \`ai-usage-tray-win-arm64-v${VERSION}.zip\` | \`.sha256\` |"
            echo ""
            echo "Self-contained single-file build; no .NET runtime required."
            echo ""
            echo "## Installation"
            echo ""
            echo "**One-step PowerShell:**"
            echo ""
            echo '```powershell'
            echo "iwr -useb https://raw.githubusercontent.com/${REPO}/main/scripts/install.ps1 | iex"
            echo '```'
            echo ""
            echo "**Manual:**"
            echo ""
            echo "1. Download the ZIP for your architecture and verify it against the \`.sha256\` file"
            echo "2. Extract to a folder of your choice"
            echo "3. Run \`AIUsageTray.exe\` (Windows SmartScreen may warn — the build is not code-signed)"
            echo "4. Follow [docs/WINDOWS-SETUP.md](https://github.com/${REPO}/blob/main/docs/WINDOWS-SETUP.md) to connect your accounts"
            echo "5. (Optional) Enable 'Start at login' in Settings"
          } > CHANGELOG.md

          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: AI Usage Tray v${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          files: |
            ./artifacts/ai-usage-tray-win-x64/*.zip
            ./artifacts/ai-usage-tray-win-x64/*.sha256
            ./artifacts/ai-usage-tray-win-arm64/*.zip
            ./artifacts/ai-usage-tray-win-arm64/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
