name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    permissions:
      contents: read

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore costats.sln

      - name: Build
        run: dotnet build costats.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test costats.sln --configuration ${{ matrix.configuration }} --no-build --verbosity normal

      - name: Test installer checksum parsing
        if: matrix.configuration == 'Release'
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\scripts\InstallChecksum.Tests.ps1

  remote-worker:
    name: Remote View Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test worker
        run: docker run --rm -v "$PWD:/work" -w /work/remote/worker node:24-alpine node --test

      # worker.bundle.js is generated from worker.js, remote/shared/*.mjs and web/*.
      # Regenerating it here proves the committed rollback artifact is not stale.
      # The container runs as the runner user so the rewritten file stays checkout-owned.
      - name: Regenerate worker bundle
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work/remote/worker \
            node:24-alpine node bundle.mjs

      - name: Verify worker bundle matches its sources
        run: |
          if ! git diff --exit-code -- remote/worker/worker.bundle.js; then
            echo "worker.bundle.js is stale. Run 'cd remote/worker && node bundle.mjs' and commit the result." >&2
            exit 1
          fi

  remote-view:
    name: Remote View Server
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read container version
        id: version
        shell: bash
        run: |
          version="$(< remote/server/VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Container version must use major.minor.patch. Received: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Test server
        run: docker run --rm -v "$PWD:/work" -w /work/remote/server node:24-alpine node --test

      - name: Build container
        run: |
          docker build \
            --build-arg VERSION=${{ steps.version.outputs.value }} \
            -f remote/server/Dockerfile \
            -t ai-usage-tray-remote-view:ci \
            .

      - name: Verify container version
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' ai-usage-tray-remote-view:ci)" = "${{ steps.version.outputs.value }}"
          test "$(docker run --rm --entrypoint cat ai-usage-tray-remote-view:ci server/VERSION)" = "${{ steps.version.outputs.value }}"
          test "$(docker image inspect --format '{{ json .Config.Volumes }}' ai-usage-tray-remote-view:ci)" = "null"

      - name: Validate Compose configuration
        run: docker compose -f remote/server/compose.yaml config --quiet

      # Runs the Compose file operators actually download, so a missing
      # capability or a broken entrypoint fallback fails here and not in
      # production. Only the image reference is overridden.
      - name: Smoke test the shipped Compose file
        run: |
          override="${RUNNER_TEMP:?}/remote-view-compose-override.yaml"
          data_dir="$PWD/remote/server/data"
          cat > "$override" <<'YAML'
          services:
            remote-view:
              image: ai-usage-tray-remote-view:ci
              pull_policy: never
          YAML
          compose() { docker compose -f remote/server/compose.yaml -f "$override" "$@"; }
          as_root() {
            docker run --rm --user 0:0 --entrypoint sh \
              --mount "type=bind,src=$data_dir,dst=/data" \
              ai-usage-tray-remote-view:ci -c "$1"
          }
          cleanup() {
            compose logs --no-color >/dev/null 2>&1 || true
            compose down --remove-orphans --timeout 10 >/dev/null 2>&1 || true
            as_root 'rm -rf /data/* /data/.[!.]* /data/..?*' >/dev/null 2>&1 || true
            rmdir "$data_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$data_dir"
          # The documented bootstrap leaves the mapped directory owned by root.
          as_root 'chown -R 0:0 /data && chmod 755 /data'
          if ! compose up -d --wait --wait-timeout 90; then
            compose logs --no-color
            exit 1
          fi
          container="$(compose ps -q remote-view)"
          # PID 1 is the server after the entrypoint dropped privileges; a plain
          # exec would report the image user instead.
          test "$(docker exec --user 0:0 "$container" awk '/^Uid:/ { print $2 }' /proc/1/status)" = "10001"
          test "$(docker exec --user 0:0 "$container" awk '/^CapEff:/ { print $2 }' /proc/1/status)" = "0000000000000000"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = "200"

      - name: Smoke test bind-mounted data directory
        run: |
          data_dir="${RUNNER_TEMP:?}/remote-view-ci-data-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          cleanup() {
            docker rm -f remote-view-ci >/dev/null 2>&1 || true
            docker run --rm --user 0:0 --entrypoint sh \
              --mount "type=bind,src=$data_dir,dst=/data" \
              ai-usage-tray-remote-view:ci \
              -c 'rm -rf /data/* /data/.[!.]* /data/..?*' >/dev/null 2>&1 || true
            rmdir "$data_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir "$data_dir"
          docker run --rm --user 0:0 --entrypoint sh \
            --mount "type=bind,src=$data_dir,dst=/data" \
            ai-usage-tray-remote-view:ci \
            -c 'touch /data/.root-owned && chown -R 0:0 /data && chmod 755 /data'
          docker run -d --name remote-view-ci \
            --read-only \
            --tmpfs /tmp:rw,size=16m \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add DAC_OVERRIDE \
            --cap-add SETGID \
            --cap-add SETUID \
            --security-opt no-new-privileges:true \
            --mount "type=bind,src=$data_dir,dst=/data" \
            ai-usage-tray-remote-view:ci
          for attempt in $(seq 1 15); do
            health=$(docker inspect --format '{{.State.Health.Status}}' remote-view-ci)
            if [ "$health" = "healthy" ]; then
              test "$(docker exec --user 0:0 remote-view-ci awk '/^Uid:/ { print $2 }' /proc/1/status)" = "10001"
              test "$(docker exec --user 0:0 remote-view-ci awk '/^CapEff:/ { print $2 }' /proc/1/status)" = "0000000000000000"
              exit 0
            fi
            sleep 1
          done
          docker logs remote-view-ci
          exit 1
